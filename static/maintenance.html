<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>피크민 다이어리 - 잠시 멈춰 있습니다</title>
<style>
    :root {
        --green: #4CAF50;
        --green-d: #388E3C;
        --deep: #2E7D32;
        --leaf: #81C784;
        --pale: #C8E6C9;
        --bg: #F2F8F0;
        --ink: #212121;
        --sub: #5A6E5C;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
                     'Malgun Gothic', sans-serif;
        line-height: 1.7;
        -webkit-text-size-adjust: 100%;
    }
    .card {
        width: 100%;
        max-width: 520px;
        background: #FFFFFF;
        border-radius: 20px;
        padding: 44px 36px 36px;
        box-shadow: 0 10px 30px rgba(45, 90, 50, 0.10);
        text-align: center;
    }
    .mark { width: 108px; height: 108px; margin-bottom: 22px; }
    .mark .sway { transform-origin: 16px 22px; animation: sway 3.2s ease-in-out infinite; }
    @keyframes sway {
        0%, 100% { transform: rotate(-4deg); }
        50%      { transform: rotate(4deg); }
    }
    @media (prefers-reduced-motion: reduce) {
        .mark .sway { animation: none; }
    }
    h1 {
        margin: 0 0 12px;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
    }
    .lead { margin: 0 0 26px; color: var(--sub); font-size: 1rem; }
    .contact {
        background: var(--bg);
        border: 1px solid var(--pale);
        border-radius: 14px;
        padding: 20px;
        text-align: left;
    }
    .contact h2 {
        margin: 0 0 10px;
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--green-d);
    }
    .contact p { margin: 0 0 14px; font-size: 0.92rem; color: var(--sub); }
    .way {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 12px 14px;
        background: #FFFFFF;
        border: 1px solid var(--pale);
        border-radius: 10px;
        color: var(--ink);
        text-decoration: none;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 500;
        line-height: 1.4;
        text-align: left;
        cursor: pointer;
    }
    .way + .way { margin-top: 8px; }
    .way:hover { border-color: var(--green); }
    .way.copied { border-color: var(--green); background: var(--bg); }
    .ico { flex: none; font-size: 1.05rem; }
    .way-text { flex: 1; min-width: 0; word-break: break-all; }
    .way-hint {
        flex: none;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--green-d);
    }
    .retry {
        margin-top: 24px;
        display: inline-block;
        padding: 13px 30px;
        background: var(--green);
        color: #FFFFFF;
        border: 0;
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
    }
    .retry:hover { background: var(--green-d); }
    .note { margin: 14px 0 0; font-size: 0.82rem; color: #8A9A8C; }
</style>
</head>
<body>
<div class="card">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="#4CAF50"/>
        <ellipse cx="16" cy="20" rx="6" ry="7" fill="#81C784"/>
        <g class="sway">
            <ellipse cx="16" cy="12" rx="3" ry="5" fill="#C8E6C9"/>
            <path d="M16 7 Q18 2 22 3" stroke="#388E3C" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
        <circle cx="14" cy="19" r="1.2" fill="#2E7D32"/>
        <circle cx="18" cy="19" r="1.2" fill="#2E7D32"/>
        <path d="M13.6 23.4 Q16 21.6 18.4 23.4" stroke="#2E7D32" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    </svg>

    <h1>잠시 사이트가 멈춰 있습니다</h1>
    <p class="lead">
        서버에 문제가 생겼습니다.<br>
        대부분 길지 않게 돌아오니 조금 뒤에 다시 들어와 주세요.
    </p>

    <div class="contact">
        <h2>오래 멈춰 있나요?</h2>
        <p>관리자가 아직 모르고 있을 수 있습니다. 아래로 알려주시면 바로 확인하겠습니다.</p>
        <a class="way" href="https://open.kakao.com/o/gkh8ZdXi" target="_blank" rel="noopener noreferrer">
            <span class="ico">💬</span>
            <span class="way-text">카카오톡 오픈채팅</span>
            <span class="way-hint">열기</span>
        </a>
        <button class="way" type="button" id="copyMail" data-mail="toritori3434@naver.com">
            <span class="ico">✉️</span>
            <span class="way-text">toritori3434@naver.com</span>
            <span class="way-hint">복사</span>
        </button>
    </div>

    <button class="retry" type="button" onclick="location.reload()">다시 시도</button>
    <p class="note">이 화면은 1분마다 저절로 새로고침됩니다.</p>
</div>
<script>
    (function () {
        var btn = document.getElementById('copyMail');
        var mail = btn.getAttribute('data-mail');
        var hint = btn.querySelector('.way-hint');
        var timer = null;

        function done() {
            hint.textContent = '복사됨';
            btn.classList.add('copied');
            clearTimeout(timer);
            timer = setTimeout(function () {
                hint.textContent = '복사';
                btn.classList.remove('copied');
            }, 2000);
        }

        function fallback() {
            var ta = document.createElement('textarea');
            ta.value = mail;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.top = '-1000px';
            document.body.appendChild(ta);
            ta.select();
            ta.setSelectionRange(0, mail.length);
            try {
                document.execCommand('copy');
                done();
            } catch (e) {
                hint.textContent = '길게 눌러 복사';
            }
            document.body.removeChild(ta);
        }

        btn.addEventListener('click', function () {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(mail).then(done, fallback);
            } else {
                fallback();
            }
        });
    })();

    setTimeout(function () { location.reload(); }, 60000);
</script>
</body>
</html>
